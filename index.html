<style>
/* Layout: single-column phone app. Sticky top bar, one hero figure, grouped list, fixed thumb bar. Warm squared-notebook paper, ink-blue pen for actions. */
:root{
  --bg:#f6efe4; --grid:#ece1cf; --card:#fffaf2; --raise:#fffdf8; --line:#e5d8c4;
  --text:#2a211b; --muted:#7b6a5b; --faint:#a8978a;
  --ink:#27427c; --ink-soft:#e4e8f1;
  --debt:#b0412d; --debt-soft:#f6e1d8; --pay:#3b7548; --pay-soft:#e1eedb;
  --warn:#9a5d00; --warn-soft:#fbe8c4;
  --display:"Unbounded",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow:0 1px 0 rgba(90,60,30,.06),0 6px 20px -10px rgba(90,60,30,.25);
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.4;color:var(--text);background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.tb-in,.main{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tb-in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px}
.shop{min-width:0}
.shop b{display:block;font-family:var(--display);font-weight:600;font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shop span{font-size:.78rem;color:var(--muted)}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:14px;min-width:46px;height:46px;padding:0 14px;font-weight:600}
.back{border:0;background:none;color:var(--ink);font-weight:600;min-height:46px;padding:0 4px;font-size:1rem}
.main{padding-block:8px calc(120px + env(safe-area-inset-bottom,0px))}

.hero{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 20px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:600;font-size:clamp(2rem,9.5vw,2.75rem);line-height:1.05;letter-spacing:-.02em;color:var(--debt)}
.big small{font-family:var(--body);font-size:.95rem;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{border:0;border-radius:12px;padding:8px 12px;font-weight:600;font-size:.9rem;background:var(--ink-soft);color:var(--ink);display:inline-flex;gap:6px;align-items:baseline}
.stat b{font-size:1.05rem}
.stat.late{background:var(--warn-soft);color:var(--warn)}
.stat.ok{background:var(--pay-soft);color:var(--pay)}
.split{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.split b{color:var(--text)}

.tools{display:flex;flex-direction:column;gap:10px;margin-block:16px 6px}
.search{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--raise);padding:0 16px;font-size:1rem}
.search::placeholder{color:var(--faint)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--grid);border-radius:14px;padding:4px;gap:4px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{border:0;background:none;border-radius:10px;min-height:40px;font-size:.88rem;font-weight:600;color:var(--muted);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--text);box-shadow:0 1px 3px rgba(90,60,30,.15)}

.group{margin-top:16px}
.gh{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted)}
.gh.late{color:var(--warn)}
.rows{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;min-height:68px}
.row:first-child{border-top:0}
.row:active{background:var(--grid)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--ink-soft);color:var(--ink);font-size:1rem;flex:none}
.av.late{background:var(--warn-soft);color:var(--warn)}
.av.ok{background:var(--pay-soft);color:var(--pay)}
.who{min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:.82rem;color:var(--muted);margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:.74rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--warn-soft);color:var(--warn)}
.pill.due{background:var(--ink-soft);color:var(--ink)}
.pill.ok{background:var(--pay-soft);color:var(--pay)}
.amt{font-weight:700;font-size:1.05rem;white-space:nowrap;text-align:right}
.amt.debt{color:var(--debt)} .amt.ok{color:var(--pay);font-weight:600;font-size:.95rem}
.tag{font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);background:var(--ink-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--card);border:1px dashed var(--line);border-radius:18px;margin-top:16px}
.linkish{border:0;background:none;color:var(--muted);font-weight:600;padding:14px 4px;text-decoration:underline;text-underline-offset:3px;font-size:.9rem;text-align:left}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:10px 10px 10px 14px;font-weight:600;font-size:.9rem;margin-bottom:12px}
.banner.ink{background:var(--ink-soft);color:var(--ink);flex-wrap:wrap}
.banner .bb{display:flex;gap:8px}
.banner button{flex:none;border:0;border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;background:var(--raise);color:inherit}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.dock-in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.btn{height:56px;border:0;border-radius:16px;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center;padding:0 12px;width:100%}
.btn.debt{background:var(--debt);color:#fff8f2}
.btn.pay{background:var(--pay);color:#f6fbf3}
.btn.ink{background:var(--ink);color:#f5f7fc}
.btn.soft{background:var(--raise);border:1px solid var(--line);color:var(--text);font-weight:600}
.btn:disabled{opacity:.5;cursor:progress}

.dh{display:flex;gap:14px;align-items:center}
.dh .av{width:52px;height:52px;font-size:1.25rem}
.dh h1{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:0;line-height:1.2;text-wrap:balance;overflow-wrap:anywhere}
.dh .ph{font-size:.9rem;color:var(--muted);margin-top:2px}
.status{display:flex;gap:8px;flex-wrap:wrap}
.status .pill{font-size:.82rem;padding:5px 10px}
.limit{display:flex;flex-direction:column;gap:6px}
.limit .row2{display:flex;justify-content:space-between;font-size:.84rem;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px}
.bar i.hot{background:var(--debt)} .bar i.ok{background:var(--pay)}
.primary{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.tg{background:#2b8fc4;color:#fff}
details.box{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-top:10px}
details.box summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;display:flex;justify-content:space-between;align-items:center;min-height:50px}
details.box summary::-webkit-details-marker{display:none}
details.box summary::after{content:"＋";color:var(--muted)}
details.box[open] summary::after{content:"−"}
details.box .bd{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:.92rem;border:1px dashed var(--line)}
.hist .h{display:grid;grid-template-columns:28px 1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line);align-items:center}
.hist .h:first-child{border-top:0}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.95rem;grid-row:span 2}
.dot.debt{background:var(--debt-soft);color:var(--debt)} .dot.pay{background:var(--pay-soft);color:var(--pay)}
.h .n{font-weight:500;overflow-wrap:anywhere}
.h .d{font-size:.8rem;color:var(--muted)}
.h .x{grid-row:span 2;font-weight:700;white-space:nowrap}
.h .x.debt{color:var(--debt)} .h .x.pay{color:var(--pay)}
.inl{display:grid;grid-template-columns:1fr auto;gap:8px}
.inl .btn{width:auto}

.plans{display:flex;flex-direction:column;gap:8px}
.plan{display:flex;flex-direction:column;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;width:100%}
.plan:active{background:var(--grid)}
.pl-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pl-top b{min-width:0;overflow-wrap:anywhere}
.pl-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.95rem}
.kv span{color:var(--muted)} .kv b{text-align:right}
.sched{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.si{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:.93rem}
.si:first-child{border-top:0}
.si .n{color:var(--faint);font-weight:700}
.si.next{background:var(--ink-soft)}
.badge{font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
.badge.paid{background:var(--pay-soft);color:var(--pay)} .badge.late{background:var(--warn-soft);color:var(--warn)}
.badge.part{background:var(--ink-soft);color:var(--ink)} .badge.up{background:var(--grid);color:var(--muted)}
.prev{background:var(--ink-soft);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.prev .pm{font-family:var(--display);font-weight:600;font-size:1.35rem}

.scrim{position:fixed;inset:0;background:rgba(55,35,20,.38);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:94%;overflow:auto;background:var(--raise);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(60,35,15,.2);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 0}
.sh-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-head h2{margin:0;font-family:var(--display);font-weight:600;font-size:1.1rem;overflow-wrap:anywhere}
.sh-head h2.debt{color:var(--debt)} .sh-head h2.pay{color:var(--pay)} .sh-head h2.ink{color:var(--ink)}
.x-btn{border:0;background:var(--grid);width:40px;height:40px;border-radius:50%;font-size:1.1rem;color:var(--muted);flex:none}
label.f,.f{display:flex;flex-direction:column;gap:6px;font-size:.84rem;font-weight:600;color:var(--muted)}
.f input{height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-size:1.05rem;color:var(--text);width:100%}
.f input.amount{height:72px;font-size:2.1rem;font-family:var(--display);font-weight:600;letter-spacing:-.02em}
.f input.amount.debt{color:var(--debt)} .f input.amount.pay{color:var(--pay)} .f input.amount.ink{color:var(--ink)}
.f input::placeholder{color:var(--faint)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:42px;font-weight:600;font-size:.92rem;color:var(--text)}
.chip[aria-pressed="true"]{background:var(--ink);color:#f5f7fc;border-color:var(--ink)}
.chip.full{border-color:var(--pay);color:var(--pay);background:var(--pay-soft)}
.chips input.mini{width:96px;height:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);padding:0 14px;font-weight:600;text-align:center}
.picked{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px}
.picked .who{display:flex;gap:10px;align-items:center;min-width:0}
.picked .av{width:36px;height:36px;font-size:.9rem}
.picked button{border:0;background:var(--grid);border-radius:10px;padding:0 12px;min-height:40px;font-weight:600;color:var(--ink);flex:none}
.suggest{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.suggest button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:0 14px;min-height:50px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.suggest button:first-child{border-top:0}
.suggest .new{color:var(--ink);font-weight:600}
.err{color:var(--debt);font-size:.88rem;font-weight:600;min-height:1.2em;margin:-6px 0}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:600}
.infobox{background:var(--pay-soft);color:var(--pay);border-radius:12px;padding:10px 14px;font-size:.92rem;font-weight:600}
.sheet .sticky{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom,0px));background:var(--raise);padding-block:6px 4px}
.note{font-size:.85rem;color:var(--muted)}

.auth{display:flex;flex-direction:column;gap:16px;padding-top:20px}
.auth-head{display:flex;gap:14px;align-items:center}
.auth-head img{width:56px;height:56px;border-radius:16px;box-shadow:var(--shadow)}
.auth h1{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0}
.lead{color:var(--muted);margin:0;max-width:44ch}
.panel{display:flex;flex-direction:column;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.center{min-height:55vh;display:grid;place-items:center;text-align:center}
.center .panel{max-width:420px;align-items:center}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ink);animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:500;counter-increment:st}
.steps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;background:var(--ink);color:#f5f7fc;display:grid;place-items:center;font-weight:700}
.steps .ico{display:inline-flex;vertical-align:-5px;width:24px;height:24px;color:var(--ink)}
.banner .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.banner .bt small{font-weight:500;opacity:.85}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--text);color:var(--card);
  border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:.95rem;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);min-height:52px}
.toast span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
.toast button{border:0;background:var(--card);color:var(--text);border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;flex:none}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .2s cubic-bezier(.2,.8,.2,1)} @keyframes up{from{transform:translateY(40px);opacity:.5}}
  .toast{animation:tin .18s ease-out} @keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>
</head>

const day=864e5,now=()=>Date.now();
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");

const sod=(t)=>{const d=t?new Date(t):new Date();d.setHours(0,0,0,0);return d.getTime()};
function addMonths(ms,n){const d=new Date(ms),y=d.getFullYear(),m=d.getMonth()+n,dd=d.getDate(),last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(dd,last)).getTime()}
const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const parseYmd=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getTime()};
const digits=v=>String(v||"").replace(/\D/g,"").slice(0,13);
const uuid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)});

async function run(q){const r=await q;if(r.error)throw r.error;return r.data}
async function fetchAll(table){
  let out=[],from=0;
  for(;;){const data=await run(sb.from(table).select("*").order("created_at",{ascending:true}).range(from,from+999));out=out.concat(data);if(data.length<1000)break;from+=1000}
  return out;
}

  const [c,t,i,s]=await Promise.all([fetchAll("customers"),fetchAll("transactions"),fetchAll("installments"),run(sb.from("settings").select("*").maybeSingle())]);
  S.customers=c.map(mapC);S.tx=t.map(mapT);S.inst=i.map(mapI);

}

/* ---------- money logic ---------- */
function planMonthly(principal,months){let base=Math.floor(principal/months/1000)*1000;if(base<=0)base=Math.floor(principal/months);return{base,last:principal-base*(months-1)}}
function schedule(p){
  const principal=p.total-p.down,{base,last}=planMonthly(principal,p.months);
  const paid=S.tx.filter(x=>x.iid===p.id&&x.type==="pay").reduce((a,x)=>a+x.amount,0);
  const today=sod();let cum=0;const items=[];
  for(let i=1;i<=p.months;i++){
    const amt=i===p.months?last:base,due=addMonths(p.start,i),part=Math.max(0,Math.min(amt,paid-cum));cum+=amt;
    items.push({n:i,due,amt,part,st:part>=amt?"paid":(due<today?"late":(part>0?"part":"up"))});
  }
  const late=items.filter(x=>x.st==="late");
  return{principal,base,paid,left:Math.max(0,principal-paid),items,next:items.find(x=>x.part<x.amt)||null,paidCount:items.filter(x=>x.st==="paid").length,late,lateSum:late.reduce((a,x)=>a+x.amt-x.part,0)};
}
function metrics(cid){
  const tx=S.tx.filter(x=>x.cid===cid);let b=0,g=0;
  for(const x of tx){const v=x.type==="debt"?x.amount:-x.amount;b+=v;if(!x.iid)g+=v}
  const t0=now(),today=sod();let late=0,next=0;
  if(g>0)for(const x of tx)if(x.type==="debt"&&!x.iid&&x.due){if(x.due<t0)late=Math.max(late,Math.max(1,Math.floor((t0-x.due)/day)));else next=next?Math.min(next,x.due):x.due}
  const plans=S.inst.filter(p=>p.cid===cid).map(p=>({p,s:schedule(p)}));
  for(const{s}of plans){if(s.left<=0)continue;if(s.late.length)late=Math.max(late,Math.max(1,Math.floor((today-s.late[0].due)/day)));else if(s.next)next=next?Math.min(next,s.next.due):s.next.due}
  return{b,g,inst:b-g,late,next,t:tx.length?Math.max(...tx.map(x=>x.date)):0,plans,active:plans.filter(x=>x.s.left>0)};
}
function reminderText(c){
  const m=metrics(c.id),l=L();let extra="";
  const nx=m.active.map(x=>x.s.next).filter(Boolean).sort((a,b)=>a.due-b.due)[0];
  if(nx)extra=l.nextLine(fmt(nx.amt-nx.part),dstr(nx.due));
  return l.msg(c.name,S.shop.name||"",fmt(Math.max(0,m.b)),S.shop.card,extra);
}

  const go=document.getElementById("inst-go"),later=document.getElementById("inst-later");
  if(go)go.onclick=async()=>{
    if(deferredPrompt){const p=deferredPrompt;deferredPrompt=null;try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==="accepted")ls.set("daftar-installed","1")}catch(e){}rerender()}
    else installGuide()};

  app.innerHTML=`<section class="auth"><div class="auth-head"><img src="icon-192.png" alt=""><h1>${l.setupT}</h1></div>
   <p class="lead">${l.setupLead}</p>
   <form class="panel" id="sf" novalidate>
    <label class="f">${l.url}<input id="s-url" inputmode="url" autocomplete="off" placeholder="https://xxxx.supabase.co" value="${esc(cfg?cfg.url:"")}"></label>
    <label class="f">${l.key}<input id="s-key" autocomplete="off" placeholder="eyJhbGciOi… / sb_publishable_…" value="${esc(cfg?cfg.anonKey:"")}"></label>
    <div class="err" id="s-err">${esc(errText||"")}</div>
    <button class="btn ink" type="submit">${l.connect}</button></form></section>`;
  document.getElementById("sf").onsubmit=e=>{e.preventDefault();
    const url=document.getElementById("s-url").value.trim().replace(/\/+$/,""),key=document.getElementById("s-key").value.trim();
    if(!/^https:\/\/[^\s]+$/.test(url)||key.length<20){document.getElementById("s-err").textContent=l.badCfg;return}
    cfg={url,anonKey:key};ls.set(CFG_KEY,JSON.stringify(cfg));boot()};
}

let authMode="login",authEmail="",authErr="",authInfo="";
function authError(e){
  const l=L(),m=String((e&&e.message)||e||"");
  if(/invalid login/i.test(m))return l.badLogin;
  if(/not confirmed/i.test(m))return l.notConfirmed;
  if(/already registered|already exists/i.test(m))return l.exists;
  if(/at least|password/i.test(m)&&/6/.test(m))return l.shortPw;
  if(/fetch|network|failed/i.test(m))return l.net;
  return m||l.net;
}
function renderAuth(){
  const l=L(),su=authMode==="signup";showDock(false);screen="auth";
  tb.innerHTML=brandTop()+langBtn();bindLangBtn(renderAuth);
  app.innerHTML=`<section class="auth">
   <div class="auth-head"><img src="icon-192.png" alt=""><h1>Mahalla Daftar</h1></div>
   <p class="lead">${l.authLead}</p>
   ${installBanner()}
   <div class="seg two" role="group"><button data-am="login" aria-pressed="${!su}">${l.login}</button><button data-am="signup" aria-pressed="${su}">${l.signup}</button></div>
   <form class="panel" id="af" novalidate>
    ${su?`<label class="f">${l.shop}<input id="a-shop" autocomplete="organization" value="${esc(pendingShop)}"></label>`:""}
    <label class="f">${l.email}<input id="a-email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" value="${esc(authEmail)}"></label>
    <label class="f">${l.password}<input id="a-pw" type="password" autocomplete="${su?"new-password":"current-password"}"></label>
    <div class="err" id="a-err">${esc(authErr)}</div>
    ${authInfo?`<div class="infobox">${esc(authInfo)}</div>`:""}
    <button class="btn ink" type="submit" id="a-go">${su?l.signup:l.login}</button>
   </form></section>`;
  bindInstall();
  app.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{authEmail=document.getElementById("a-email").value;authMode=b.dataset.am;authErr="";authInfo="";renderAuth()});
  document.getElementById("af").onsubmit=async e=>{
    e.preventDefault();
    const email=document.getElementById("a-email").value.trim(),pw=document.getElementById("a-pw").value,er=document.getElementById("a-err"),go=document.getElementById("a-go");
    authEmail=email;const sh=document.getElementById("a-shop");if(sh){pendingShop=sh.value.trim();ls.set("daftar-pending-shop",pendingShop)}
    if(!email||!pw){er.textContent=l.needEmail;return}
    if(su&&pw.length<6){er.textContent=l.shortPw;return}
    go.disabled=true;er.textContent="";
    try{
      if(su){
        const r=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
        if(r.error)throw r.error;
        if(!r.data.session){authMode="login";authErr="";authInfo=l.checkMail(email);renderAuth()}
      }else{
        const r=await sb.auth.signInWithPassword({email,password:pw});
        if(r.error)throw r.error;
      }
    }catch(err){authErr=authError(err);authInfo="";renderAuth()}
  };
}

/* ---------- app start ---------- */
let starting=false;
async function startApp(){
  if(starting)return;starting=true;renderLoading();
  try{await load();S.offline=false;saveCache()}
  catch(e){if(!loadCache()){starting=false;return renderMessage(L().net,()=>startApp())}S.offline=true}
  starting=false;
  if(pendingShop&&!S.shop.name&&!S.offline){
    try{await run(sb.from("settings").upsert({owner_id:user.id,shop_name:pendingShop,lang:S.lang},{onConflict:"owner_id"}));S.shop.name=pendingShop;saveCache()}catch(e){}
    pendingShop="";ls.del("daftar-pending-shop");
  }
  view={name:"list",filter:"owing",q:""};render();
}
function resetData(){S.customers=[];S.tx=[];S.inst=[];S.shop={name:"",card:""};S.offline=false}

async function boot(){
  if(!window.supabase||!window.supabase.createClient)return renderMessage(L().libFail,()=>location.reload());
  if(!cfg)return renderSetup();
  try{sb=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"daftar-auth"}})}
  catch(e){return renderSetup(L().badCfg)}
  renderLoading();
  let session=null;
  try{const r=await sb.auth.getSession();session=r.data&&r.data.session}catch(e){}
  if(session)user=session.user;
  sb.auth.onAuthStateChange((ev,ses)=>{
    if(ev==="SIGNED_OUT"){user=null;resetData();closeSheet();authInfo="";authErr="";renderAuth()}
    else if(ses&&ses.user&&(!user||user.id!==ses.user.id)&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION")){user=ses.user;setTimeout(startApp,0)}
  });
  if(session)startApp();else renderAuth();
}

   <span class="who"><div class="nm">${esc(r.c.name)}${m.active.length?`<span class="tag">${l.instTag}</span>`:""}</div><div class="sub">${sub}</div></span>

async function importOld(old,btn){
  if(!canWrite())return;btn.disabled=true;
  const idMap={},custs=old.cs.map(c=>{const id=uuid();idMap[c.id]=id;return{id,name:String(c.name||"?").slice(0,120),phone:c.phone?String(c.phone).slice(0,40):null,limit_amount:Math.max(0,Number(c.limit)||0)}});
  const txs=(old.o.tx||[]).filter(x=>idMap[x.cid]&&Number(x.amount)>0&&(x.type==="debt"||x.type==="pay")).map(x=>({customer_id:idMap[x.cid],type:x.type,amount:Math.round(Number(x.amount)),note:x.note?String(x.note).slice(0,300):null,created_at:new Date(x.date||now()).toISOString(),due_at:x.due?new Date(x.due).toISOString():null}));
  try{
    await run(sb.from("customers").insert(custs));
    if(txs.length)await run(sb.from("transactions").insert(txs));
    ls.set("daftar-imported","done");
    await load();saveCache();renderList();toast(L().imported(custs.length));
  }catch(e){btn.disabled=false;toast(L().saveFail)}
}

  const pct=s.principal?Math.min(100,s.paid/s.principal*100):0;

  return `<button class="plan" data-plan="${p.id}">
   <div class="pl-top"><b>${esc(p.title)}</b><span class="amt num ${s.left>0?"debt":"ok"}">${s.left>0?fmt(s.left):"✓"}</span></div>
   <div class="bar"><i class="${s.left<=0?"ok":""}" style="width:${pct}%"></i></div>
   <div class="pl-meta"><span>${l.paidOf(s.paidCount,p.months)}</span>${right}</div></button>`;
}

/* ---------- installment plan sheet ---------- */
function openPlan(pid){
  const l=L(),p=S.inst.find(x=>x.id===pid);if(!p)return;
  const s=schedule(p),stTxt={paid:l.stPaid,late:l.stLate,part:l.stPart,up:l.stUp};
  sheet(p.title,"ink",`
   <div class="kv">
    <span>${l.priceTotal}</span><b class="num">${fmt(p.total)}</b>
    ${p.down?`<span>${l.downLbl}</span><b class="num">${fmt(p.down)}</b>`:""}
    <span>${l.perMonth}</span><b class="num">${fmt(s.base)} × ${p.months}</b>
    <span>${l.paidLbl}</span><b class="num" style="color:var(--pay)">${fmt(s.paid)}</b>
    <span>${l.leftLbl}</span><b class="num" style="color:${s.left>0?"var(--debt)":"var(--pay)"}">${fmt(s.left)}</b>
   </div>
   <div class="gh" style="padding:0"><span>${l.schedT}</span><span>${l.paidOf(s.paidCount,p.months)}</span></div>
   <div class="sched">${s.items.map(it=>`<div class="si ${s.next&&s.next.n===it.n&&it.st!=="late"?"next":""}"><span class="n num">${it.n}</span><span>${dstr(it.due)}</span>
     <b class="num">${it.st==="part"||(it.st==="late"&&it.part>0)?`${fmt(it.part)} / `:""}${fmt(it.amt)}</b><span class="badge ${it.st}">${stTxt[it.st]}</span></div>`).join("")}</div>
   ${s.left>0?`<div class="sticky"><button class="btn pay" id="acc">${l.acceptMonthly}${s.next?` · ${fmt(s.next.amt-s.next.part)}`:""}</button></div>`:""}
   <details class="box"><summary>${l.delPlan}</summary><div class="bd"><button class="btn debt" id="pdel">${l.delSure}</button></div></details>`);
  const acc=document.getElementById("acc");
  if(acc)acc.onclick=()=>{closeSheet();openEntry("pay",p.cid,{iid:p.id,amount:s.next?s.next.amt-s.next.part:s.left})};
  document.getElementById("pdel").onclick=async e=>{
    if(!canWrite())return;e.currentTarget.disabled=true;
    try{await run(sb.from("installments").delete().eq("id",p.id));
      S.inst=S.inst.filter(x=>x.id!==p.id);S.tx=S.tx.filter(x=>x.iid!==p.id);saveCache();closeSheet();render()}
    catch(err){e.currentTarget.disabled=false;toast(l.saveFail)}};
}

/* ---------- utilities ---------- */
function copyText(text,el){
  const l=L(),fallback=()=>{if(!el)return;if(el.select){el.select();return}const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)};
  try{navigator.clipboard.writeText(text).then(()=>toast(l.copied),fallback)}catch(e){fallback()}
}
let toastTimer;
function toast(text,undoFn){
  const l=L();clearTimeout(toastTimer);
  let t=document.getElementById("toast");if(t)t.remove();
  t=document.createElement("div");t.className="toast";t.id="toast";t.setAttribute("role","status");
  t.innerHTML=`<span>${esc(text)}</span>${undoFn?`<button>${l.undo}</button>`:""}`;
  document.body.appendChild(t);
  if(undoFn)t.querySelector("button").onclick=async e=>{e.currentTarget.disabled=true;clearTimeout(toastTimer);
    try{await undoFn();t.remove();toast(l.undone)}catch(err){t.remove();toast(l.saveFail)}};
  toastTimer=setTimeout(()=>t.remove(),undoFn?6000:2400);
}
function closeSheet(){layer.innerHTML="";document.body.style.overflow=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function sheet(title,cls,html){
  layer.innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="in"><div class="grab"></div>
   <div class="sh-head"><h2 class="${cls}">${esc(title)}</h2><button class="x-btn" id="xb" aria-label="${L().cancel}">✕</button></div>${html}</div></div>`;
  document.body.style.overflow="hidden";
  document.getElementById("scrim").onclick=closeSheet;document.getElementById("xb").onclick=closeSheet;
}
async function ensureCustomer(st,allowCreate){
  let cust=st.cid&&S.customers.find(x=>x.id===st.cid);
  if(cust)return{cust,created:false};
  const n=st.newName.trim();if(!n)return null;
  cust=S.customers.find(x=>x.name.toLowerCase()===n.toLowerCase());
  if(cust)return{cust,created:false};
  if(!allowCreate)return null;
  const row=await run(sb.from("customers").insert({name:n.slice(0,120),phone:st.phone.trim()||null}).select().single());
  cust=mapC(row);S.customers.push(cust);return{cust,created:true};
}
async function dropCustomer(id){await run(sb.from("customers").delete().eq("id",id));S.customers=S.customers.filter(x=>x.id!==id);S.tx=S.tx.filter(x=>x.cid!==id);S.inst=S.inst.filter(x=>x.cid!==id)}

/* ---------- entry sheet: debt / installment / payment ---------- */
function openEntry(type,cid,opts){
  opts=opts||{};const l=L();
  const st={cid:cid||null,newName:"",phone:"",amount:opts.amount?String(opts.amount):"",due:0,note:"",
    mode:"simple",title:"",price:"",down:"",months:6,iid:opts.iid!==undefined?opts.iid:"auto"};
  const draw=focus=>{
    const c=st.cid&&S.customers.find(x=>x.id===st.cid);
    const m=c?metrics(c.id):null;
    if(type==="pay"&&c&&st.iid==="auto")st.iid=(m.g>0||!m.active.length)?null:m.active[0].p.id;
    const inst=type==="debt"&&st.mode==="inst";
    const recent=[...S.customers].sort((a,b)=>metrics(b.id).t-metrics(a.id).t);
    const q=st.newName.trim().toLowerCase();
    const sug=(q?recent.filter(x=>x.name.toLowerCase().includes(q)):(type==="pay"?recent.filter(x=>metrics(x.id).b>0):recent)).slice(0,5);
    const exact=q&&S.customers.some(x=>x.name.toLowerCase()===q),canNew=q&&!exact&&type==="debt";
    const amt=parseInt(st.amount)||0,cb=m?m.b:0;
    const willOver=!inst&&c&&type==="debt"&&c.limit&&cb+amt>c.limit;
    const tPlan=type==="pay"&&st.iid?m&&m.active.find(x=>x.p.id===st.iid):null;
    const fullChips=type!=="pay"||!c?"":(tPlan?[[l.nextPay,tPlan.s.next?tPlan.s.next.amt-tPlan.s.next.part:0],[l.full,tPlan.s.left]]:[[l.full,Math.max(0,m.g)]]).filter(x=>x[1]>0).map(([lbl,v])=>`<button class="chip full num" data-v="${v}">${lbl}: ${fmt(v)}</button>`).join("");
    const title=type==="pay"?l.payT:(inst?l.modeInst:l.debtT),cls=type==="pay"?"pay":(inst?"ink":"debt");
    sheet(title,cls,`
     ${type==="debt"?`<div class="seg two" role="group"><button data-mode="simple" aria-pressed="${!inst}">${l.modeSimple}</button><button data-mode="inst" aria-pressed="${inst}">${l.modeInst}</button></div>`:""}
     ${c?`<div class="picked"><span class="who"><span class="av">${esc(initial(c.name))}</span><span style="min-width:0"><div class="nm">${esc(c.name)}</div>
        <div class="sub num" style="color:${cb>0?"var(--debt)":"var(--pay)"}">${cb>0?fmt(cb)+" so'm":"✓"}</div></span></span><button id="chg">${l.change}</button></div>`
      :`<label class="f">${type==="debt"?l.who:l.whoPay}<input id="nm" placeholder="${l.whoPh}" value="${esc(st.newName)}" autocomplete="off"></label>
        ${(sug.length||canNew)?`<div class="suggest">${sug.map(x=>{const b=metrics(x.id).b;return `<button data-pick="${x.id}"><span>${esc(x.name)}</span><span class="amt num ${b>0?"debt":"ok"}" style="font-size:.95rem">${b>0?fmt(b):"✓"}</span></button>`}).join("")}
          ${canNew?`<button class="new" data-new="1">＋ ${l.newC}: «${esc(st.newName.trim())}»</button>`:""}</div>`:""}
        ${canNew?`<label class="f">${l.phone}<input id="ph" inputmode="tel" placeholder="+998" value="${esc(st.phone)}"></label>`:""}`}
     ${type==="pay"&&c&&m.active.length?`<div class="f">${l.target}<div class="chips">
        <button class="chip" data-iid="" aria-pressed="${!st.iid}">${l.toGeneral}${m.g>0?` · ${fmt(m.g)}`:""}</button>
        ${m.active.map(({p,s})=>`<button class="chip" data-iid="${p.id}" aria-pressed="${st.iid===p.id}">${esc(p.title)} · ${fmt(s.left)}</button>`).join("")}</div></div>`:""}
     ${inst?`
      <label class="f">${l.product}<input id="ti" value="${esc(st.title)}" autocomplete="off"></label>
      <label class="f">${l.price}<input id="pr" class="amount ink" inputmode="numeric" placeholder="0" value="${st.price?fmt(st.price):""}" autocomplete="off"></label>
      <label class="f">${l.downP}<input id="dn" inputmode="numeric" placeholder="0" value="${st.down?fmt(st.down):""}" autocomplete="off"></label>
      <div class="f">${l.months}<div class="chips">${[3,6,9,12].map(n=>`<button class="chip" data-mo="${n}" aria-pressed="${st.months===n}">${n} ${l.mo}</button>`).join("")}
        <input class="mini num" id="mo" inputmode="numeric" value="${[3,6,9,12].includes(st.months)?"":st.months}" placeholder="…" aria-label="${l.months}"></div></div>
      <div class="prev" id="prev">${previewHTML()}</div>`
     :`
      <label class="f">${l.amount}<input id="am" class="amount ${type}" inputmode="numeric" placeholder="0" value="${st.amount?fmt(st.amount):""}" autocomplete="off"></label>
      <div class="chips">${fullChips}${[5000,10000,20000,50000,100000].map(v=>`<button class="chip num" data-add="${v}">+${fmt(v)}</button>`).join("")}</div>
      ${willOver?`<div class="warnbox">⚠︎ ${l.overLimit} (${fmt(c.limit)})</div>`:""}
      ${type==="debt"?`<div class="f">${l.due}<div class="chips">${[["none",0],["d3",3],["w1",7],["m1",30]].map(([k,d])=>`<button class="chip" data-due="${d}" aria-pressed="${st.due===d}">${l[k]}</button>`).join("")}</div></div>`:""}
      <label class="f">${l.note}<input id="nt" value="${esc(st.note)}" autocomplete="off"></label>`}
     <div class="err" id="er"></div>
     <div class="sticky"><button class="btn ${cls}" id="sv">${saveLabel()}</button></div>`);
    bind(focus,c,cb,willOver);
  };
  const saveLabel=()=>{
    if(type==="debt"&&st.mode==="inst"){const pr=parseInt(st.price)||0,dn=parseInt(st.down)||0;return l.saveI+(pr>dn&&pr?` · ${fmt(pr-dn)}`:"")}
    const v=parseInt(st.amount)||0;return(type==="debt"?l.saveD:l.saveP)+(v?` · ${fmt(v)}`:"");
  };
  function previewHTML(){
    const pr=parseInt(st.price)||0,dn=parseInt(st.down)||0,mo=st.months;
    if(!pr||dn>=pr||!(mo>=1&&mo<=60))return `<span>${l.perMonth}</span><span class="pm num">—</span>`;
    const pc=planMonthly(pr-dn,mo),t0=sod();
    return `<span>${l.perMonth}</span><span class="pm num">${fmt(pc.base)} × ${mo}</span>
      <span>${l.toDebt}: <b class="num">${fmt(pr-dn)}</b></span>
      <span>${l.firstPay}: ${dstr(addMonths(t0,1))} · ${l.lastPay}: ${dstr(addMonths(t0,mo))}${pc.last!==pc.base?` (${fmt(pc.last)})`:""}</span>`;
  }
  const refreshLive=()=>{const p=document.getElementById("prev");if(p)p.innerHTML=previewHTML();const s=document.getElementById("sv");if(s)s.textContent=saveLabel()};
  function money(id,key,after){
    const el=document.getElementById(id);if(!el)return;
    el.oninput=e=>{const raw=digits(e.target.value);st[key]=raw;e.target.value=raw?fmt(raw):"";(after||refreshLive)()};
  }
  function bind(focus,c,cb,willOver){
    layer.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{st.mode=b.dataset.mode;draw(st.cid?(st.mode==="inst"?"ti":"am"):"nm")});
    const nm=document.getElementById("nm");
    if(nm)nm.oninput=e=>{st.newName=e.target.value;const p=e.target.selectionStart;draw();const n=document.getElementById("nm");n.focus();try{n.setSelectionRange(p,p)}catch(_){}};
    const ph=document.getElementById("ph");if(ph)ph.oninput=e=>st.phone=e.target.value;
    layer.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{st.cid=b.dataset.pick;st.newName="";if(opts.iid===undefined)st.iid="auto";draw(st.mode==="inst"?"ti":"am")});
    const nb=layer.querySelector("[data-new]");if(nb)nb.onclick=()=>{const t=document.getElementById(ph?"ph":(st.mode==="inst"?"ti":"am"));if(t)t.focus()};
    const chg=document.getElementById("chg");if(chg)chg.onclick=()=>{st.cid=null;st.newName="";if(opts.iid===undefined)st.iid="auto";draw("nm")};
    layer.querySelectorAll("[data-iid]").forEach(b=>b.onclick=()=>{st.iid=b.dataset.iid||null;st.amount="";draw("am")});
    money("am","amount",()=>{refreshLive();const v=parseInt(st.amount)||0;const over=!!(c&&type==="debt"&&c.limit&&cb+v>c.limit);if(over!==!!willOver)draw("am")});
    money("pr","price");money("dn","down");
    const ti=document.getElementById("ti");if(ti)ti.oninput=e=>st.title=e.target.value;
    const mo=document.getElementById("mo");
    if(mo)mo.oninput=e=>{const v=parseInt(digits(e.target.value).slice(0,2))||0;e.target.value=v||"";st.months=v;layer.querySelectorAll("[data-mo]").forEach(b=>b.setAttribute("aria-pressed",String(+b.dataset.mo===v)));refreshLive()};
    layer.querySelectorAll("[data-mo]").forEach(b=>b.onclick=()=>{st.months=+b.dataset.mo;draw()});
    layer.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{st.amount=String((parseInt(st.amount)||0)+ +b.dataset.add);draw()});
    layer.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{st.amount=b.dataset.v;draw()});
    layer.querySelectorAll("[data-due]").forEach(b=>b.onclick=()=>{st.due=+b.dataset.due;draw()});
    const nt=document.getElementById("nt");if(nt)nt.oninput=e=>st.note=e.target.value;
    document.getElementById("sv").onclick=save;
    layer.querySelectorAll(".sheet input").forEach(i=>i.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();save()}}));
    const target=focus===undefined?null:(focus||(st.cid?(st.mode==="inst"?"ti":"am"):"nm"));
    const fe=target&&document.getElementById(target);
    if(fe)setTimeout(()=>{fe.focus();try{fe.setSelectionRange(fe.value.length,fe.value.length)}catch(_){}},focus===null?80:0);
  }
  let saving=false;
  async function save(){
    if(saving)return;
    const er=document.getElementById("er"),btn=document.getElementById("sv");
    const fail=t=>{er.textContent=t;saving=false;btn.disabled=false};
    const inst=type==="debt"&&st.mode==="inst";
    const amount=parseInt(st.amount)||0,price=parseInt(st.price)||0,down=parseInt(st.down)||0;
    if(!st.cid&&!st.newName.trim())return fail(l.needWho);
    if(inst){
      if(!st.title.trim())return fail(l.needProduct);
      if(!price)return fail(l.needPrice);
      if(down>=price)return fail(l.badDown);
      if(!(st.months>=1&&st.months<=60))return fail(l.badMonths);
    }else if(amount<=0)return fail(l.needAmt);
    if(!canWrite())return;
    saving=true;btn.disabled=true;er.textContent="";
    let res;
    try{res=await ensureCustomer(st,type==="debt");}catch(e){return fail(l.saveFail)}
    if(!res)return fail(l.needWho);
    const{cust,created}=res;
    try{
      if(inst){
        const row=await run(sb.from("installments").insert({customer_id:cust.id,title:st.title.trim().slice(0,120),total:price,down_payment:down,months:st.months,start_date:ymd(now())}).select().single());
        const p=mapI(row);
        let trow;
        try{trow=await run(sb.from("transactions").insert({customer_id:cust.id,installment_id:p.id,type:"debt",amount:price-down,note:p.title}).select().single())}
        catch(e){await sb.from("installments").delete().eq("id",p.id);throw e}
        S.inst.push(p);S.tx.push(mapT(trow));saveCache();closeSheet();render();
        toast(`${l.savedI} · ${cust.name} · ${fmt(price-down)}`,async()=>{
          await run(sb.from("installments").delete().eq("id",p.id));S.inst=S.inst.filter(x=>x.id!==p.id);S.tx=S.tx.filter(x=>x.iid!==p.id);
          if(created)await dropCustomer(cust.id);if(created&&view.cid===cust.id)view.name="list";saveCache();render()});
      }else{
        const row=await run(sb.from("transactions").insert({customer_id:cust.id,installment_id:type==="pay"&&st.iid?st.iid:null,type,amount,
          note:st.note.trim().slice(0,300)||null,due_at:type==="debt"&&st.due?new Date(now()+st.due*day).toISOString():null}).select().single());
        const tx=mapT(row);S.tx.push(tx);saveCache();closeSheet();render();
        toast(`${type==="debt"?l.savedD:l.savedP} · ${cust.name} · ${fmt(amount)}`,async()=>{
          await run(sb.from("transactions").delete().eq("id",tx.id));S.tx=S.tx.filter(x=>x.id!==tx.id);
          if(created)await dropCustomer(cust.id);if(created&&view.cid===cust.id)view.name="list";saveCache();render()});
      }
    }catch(e){
      if(created){try{await dropCustomer(cust.id)}catch(_){}}
      fail(l.saveFail);
    }
  }
  draw(null);
}

/* ---------- settings ---------- */
function openSettings(){
  const l=L();
  sheet(l.settings,"ink",`
   <div class="f">${l.lang}<div class="chips"><button class="chip" data-l="uz" aria-pressed="${S.lang==="uz"}">O'zbekcha</button><button class="chip" data-l="ru" aria-pressed="${S.lang==="ru"}">Русский</button></div></div>
   <label class="f">${l.shop}<input id="sn" value="${esc(S.shop.name)}" autocomplete="organization"></label>
   <label class="f">${l.card}<input id="sc" inputmode="numeric" value="${esc(S.shop.card)}" placeholder="8600 …"></label>
   <div class="err" id="ser"></div>
   <button class="btn ink" id="ss">${l.save}</button>
   <div class="gh" style="margin-top:8px;padding:0"><span>${l.account}</span></div>
   <div class="kv"><span>${l.email}</span><b style="overflow-wrap:anywhere">${esc(user&&user.email||"")}</b></div>
   <div class="note">${l.cloud}</div>
   <button class="btn soft" id="lo">${l.logout}</button>`);
  layer.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{
    setLang(b.dataset.l);render();openSettings();
    if(!S.offline&&user)sb.from("settings").upsert({owner_id:user.id,lang:S.lang,shop_name:S.shop.name||null,card:S.shop.card||null},{onConflict:"owner_id"}).then(()=>{},()=>{})});
  document.getElementById("ss").onclick=async e=>{
    if(!canWrite())return;const btn=e.currentTarget;btn.disabled=true;
    const name=document.getElementById("sn").value.trim().slice(0,80),card=document.getElementById("sc").value.trim().slice(0,40);
    try{await run(sb.from("settings").upsert({owner_id:user.id,shop_name:name||null,card:card||null,lang:S.lang,updated_at:new Date().toISOString()},{onConflict:"owner_id"}));
      S.shop={name,card};saveCache();closeSheet();render();toast(l.saved)}
    catch(err){btn.disabled=false;document.getElementById("ser").textContent=l.saveFail}};
  document.getElementById("lo").onclick=async e=>{e.currentTarget.disabled=true;ls.del(cacheKey());try{await sb.auth.signOut()}catch(err){}
    if(user){user=null;resetData();closeSheet();renderAuth()}};
}

setLang(S.lang);
boot();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
